<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)"/>
  
  <!-- Letter T -->
  <text x="100" y="125" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">T</text>
  
  <!-- Number 4 -->
  <text x="145" y="125" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">4</text>
  
  <!-- IT text -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">IT</text>
  
  <!-- Decorative dots -->
  <circle cx="40" cy="100" r="5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="160" cy="100" r="5" fill="rgba(255,255,255,0.5)"/>
</svg>